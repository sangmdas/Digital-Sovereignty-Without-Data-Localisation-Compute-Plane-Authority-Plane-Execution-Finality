[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-sovereignty-authority-plane-reference"
version = "0.1.0"
description = "Runnable reference implementation of Compute Plane / Authority Plane separation with execution-finality enforcement"
requires-python = ">=3.11"
license = {text = "SEE LICENSE-NOTICE.md"}
authors = [{name = "Sangam Das"}]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[project.optional-dependencies]
crypto = ["cryptography>=42"]
dev = ["pytest>=8", "pytest-cov>=6"]
